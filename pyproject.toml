[project]
name = "rcw-graph-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chandlerNick", email = "njchandler2002@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-genai>=2.33.0",
    "lancedb>=0.40.0",
    "lxml>=6.1.3",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "requests>=2.34.2",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.66.1",
    "torch>=2.6.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
[project.scripts]
rcw-graph-rag = "rcw_graph_rag:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
